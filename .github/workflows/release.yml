name: Release

# Publishes the module to the PowerShell Gallery.
#
# The MANIFEST is the source of truth for the version, not the tag. A consumer in
# development mode runs the module straight out of a clone, so the committed
# .psd1 has to state its own version truthfully — a version injected at build
# time would make every dev-mode copy lie about what it is. The tag therefore has
# to agree with the manifest, and this workflow refuses to publish when it does
# not, rather than shipping a mislabelled package.
#
#   v1.4.2            -> ModuleVersion 1.4.2, no prerelease
#   v0.1.0-preview1   -> ModuleVersion 0.1.0, Prerelease 'preview1'

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Validate and pack, but do not publish'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # powershell-yaml is a declared RequiredModule: Publish-Module runs
          # Test-ModuleManifest internally and that fails if it is absent.
          if (-not (Get-Module -ListAvailable powershell-yaml)) {
              Install-Module powershell-yaml -Scope CurrentUser -Force
          }
          if (-not (Get-Module -ListAvailable Pester | Where-Object { $_.Version.Major -ge 5 })) {
              Install-Module Pester -MinimumVersion 5.0.0 -Scope CurrentUser -Force -SkipPublisherCheck
          }

      - name: Run tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Pester -MinimumVersion 5.0.0
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Normal'
          Invoke-Pester -Configuration $config

      - name: Verify the tag agrees with the manifest
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifestPath = './system/NKDAgility.AzureDevOps.Governance/NKDAgility.AzureDevOps.Governance.psd1'
          $manifest = Import-PowerShellDataFile -LiteralPath $manifestPath

          $moduleVersion = [string]$manifest.ModuleVersion
          $prerelease    = [string]$manifest.PrivateData.PSData.Prerelease

          # workflow_dispatch has no tag; validate the manifest against itself so a
          # dry run still exercises this step.
          $ref = '${{ github.ref }}'
          $tag = if ($ref -like 'refs/tags/*') { $ref -replace '^refs/tags/', '' }
                 else { 'v' + $moduleVersion + $(if ($prerelease) { "-$prerelease" } else { '' }) }

          # v1.2.3 or v1.2.3-preview1
          if ($tag -notmatch '^v(?<ver>\d+\.\d+\.\d+)(?:-(?<pre>[A-Za-z0-9]+))?$') {
              throw "Tag '$tag' is not of the form v1.2.3 or v1.2.3-preview1."
          }
          $tagVersion    = $Matches['ver']
          $tagPrerelease = [string]$Matches['pre']

          if ($tagVersion -ne $moduleVersion) {
              throw "Tag says $tagVersion but the manifest ModuleVersion is $moduleVersion. Bump the manifest and re-tag; the manifest is the source of truth."
          }
          if ($tagPrerelease -ne $prerelease) {
              throw "Tag prerelease '$tagPrerelease' does not match the manifest Prerelease '$prerelease'."
          }

          $full = $moduleVersion + $(if ($prerelease) { "-$prerelease" } else { '' })
          Write-Host "Publishing version $full"
          "version=$full"          >> $env:GITHUB_OUTPUT
          "isPrerelease=$([bool]$prerelease)".ToLower() >> $env:GITHUB_OUTPUT

      - name: Publish to the PowerShell Gallery
        if: github.event_name == 'push' || inputs.dryRun == false
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:PSGALLERY_API_KEY) {
              throw "PSGALLERY_API_KEY is not set. Add it as an Actions secret, and if it is an organisation secret make sure this repository is in its access list."
          }
          Publish-Module `
              -Path ./system/NKDAgility.AzureDevOps.Governance `
              -NuGetApiKey $env:PSGALLERY_API_KEY `
              -Repository PSGallery `
              -Verbose

      - name: Validate only (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dryRun == true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Test-ModuleManifest ./system/NKDAgility.AzureDevOps.Governance/NKDAgility.AzureDevOps.Governance.psd1 |
              Format-List Name, Version, Author, Description, ProjectUri, LicenseUri
          Write-Host 'Dry run: manifest and tests validated, nothing published.'

      - name: Create the GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ steps.version.outputs.version }}" \
            --generate-notes \
            ${{ steps.version.outputs.isPrerelease == 'true' && '--prerelease' || '' }}
