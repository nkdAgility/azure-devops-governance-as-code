name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Pester (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache PowerShell modules
        uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'Windows' && '~\Documents\PowerShell\Modules' || '~/.local/share/powershell/Modules' }}
          key: psmodules-${{ runner.os }}-pester5-yaml
          restore-keys: psmodules-${{ runner.os }}-

      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Windows images ship Pester 3.4 in-box; -SkipPublisherCheck is required
          # to install the 5.x line alongside it.
          if (-not (Get-Module -ListAvailable Pester | Where-Object { $_.Version.Major -ge 5 })) {
              Install-Module Pester -MinimumVersion 5.0.0 -Scope CurrentUser -Force -SkipPublisherCheck
          }
          if (-not (Get-Module -ListAvailable powershell-yaml)) {
              Install-Module powershell-yaml -Scope CurrentUser -Force
          }

      - name: Run tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Pester -MinimumVersion 5.0.0

          $config = New-PesterConfiguration
          $config.Run.Path      = './tests'
          $config.Run.Exit      = $true
          $config.Output.Verbosity          = 'Detailed'
          $config.TestResult.Enabled        = $true
          $config.TestResult.OutputPath     = 'TestResults/pester.xml'
          $config.TestResult.OutputFormat   = 'NUnitXml'

          Invoke-Pester -Configuration $config

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-results-${{ matrix.os }}
          path: TestResults/pester.xml
          if-no-files-found: warn

  manifest:
    name: Module manifest is valid
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test-ModuleManifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # powershell-yaml is a declared RequiredModule, so it must be present
          # for the manifest to validate.
          if (-not (Get-Module -ListAvailable powershell-yaml)) {
              Install-Module powershell-yaml -Scope CurrentUser -Force
          }
          Test-ModuleManifest ./system/NKDAgility.AzureDevOps.Governance/NKDAgility.AzureDevOps.Governance.psd1 |
              Format-List Name, Version, Author, Description, ProjectUri, LicenseUri
